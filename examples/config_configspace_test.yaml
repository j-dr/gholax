  Nx2PTCorrelationFunction:
    params: {}
    analytic_marginalization: false
    zmin_proj: 0.1
    zmax_proj: 1.5
    use_boltzmann: true
    data_vector:
      data_vector_info_filename: examples/dummy_configspace_dv.h5
      scale_cuts: null
      dummy_cov: false
      zeff_weighting: false
      spectrum_info:
        xi_plus:
          bins0: [0, 1]
          bins1: [0, 1]
          use_cross: true
        xi_minus:
          bins0: [0, 1]
          bins1: [0, 1]
          use_cross: true

theory:
  LinearPowerSpectrum: {}
  
  Boltzmann: {}
  
  ExpansionHistory:
    use_emulator: false

  LinearGrowth:
    use_emulator: false

  RealSpaceMatterPowerSpectrum:
    use_emulator: false
    use_boltzmann: true

  RealSpaceBiasedTracerSpectra:
    bias_model: cleft
    use_emulator: false

  RealSpaceBiasExpansion:
    bias_model: cleft
    baryon_z_evolution_model: spline
    p_mm_ct_order: 1
    p_mm_ct_pade: true
    spline_N: 3
    spline_Delta: 0.6
    scale_by_s8z: true
    p_mm_uv_behavior: dmo

  DensityShapeIA:
    use_emulator: false

  ShapeShapeIA:
    use_emulator: false

  RealSpaceIAExpansion:
    z_evolution_model: powerlaw
    scale_by_s8z: false
    include_magnification_x_ia: false
    no_ia: true
    zeff_weighting: false

projection:
  k_cutoff: 2.0
  LensingCounterterm:
    non_parametric_growth: false
    lensing_counterterm_order: 3
    mean_model: dmo
  Limber:
    non_parametric_growth: false
    k_cutoff: null
    no_ia: true
  AngularPowerSpectrum_to_CorrelationFunction: {}

sampler:
  NUTS:
    n_steps_warmup: 50
    n_steps: 10
    random_start: true
