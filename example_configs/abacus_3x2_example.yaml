theory:
  ExpansionHistory:
     use_emulator: False
#    use_emulator: False
#    emulator_file_names: 
#      chi_z: aemulus_nu_tier1_cosmo_only_heft_chiz_emu
#      e_z: aemulus_nu_tier1_cosmo_only_heft_ez_emu

  LinearGrowth:
    use_emulator: True
    emulator_file_name: 'emu_sigma8z_w0wa.yaml'

  SpectralEquivalence: 
    dummy: False

  RealSpaceMatterPowerSpectrum:
    use_emulator: True
    emulator_file_names: emu_config_dst_irresum.yaml

  RealSpaceBiasedTracerSpectra:
    bias_model: heft #as opposed to CLEFT/linear bias
    use_emulator: True
    emulator_file_names: emu_config_dst_irresum.yaml

  RealSpaceBiasExpansion:
    baryon_z_evolution_model : spline
    p_mm_ct_order : 1
    p_mm_ct_pade: True
    spline_N: 3
    spline_Delta: 0.6
    bias_model: heft
    scale_by_s8z: True
  
  DensityShapeIA:
    use_emulator: True
    emulator_file_names: 'emu_p_density_shape_w0wa.yaml'

  ShapeShapeIA:
    use_emulator: True
    emulator_file_names: 
     - emu_p0_shape_shape_w0wa.yaml
     - emu_p1_shape_shape_w0wa.yaml
     - emu_p2_shape_shape_w0wa.yaml

  RealSpaceIAExpansion:
    z_evolution_model : per_source_bin_spline
    spline_N: 5
    spline_Delta: 0.5
    scale_by_s8z: True
    include_magnification_x_ia: True
    no_ia: False
    independent_p_mi_ct: False
  
projection:
  k_cutoff: 1.0
  LensingCounterterm:
    lensing_counterterm_order: 3

